name: test

on: [push]

jobs:
  test:
    strategy:
      matrix:
        platform:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@master
    - uses: ilammy/msvc-dev-cmd@v1
      if: ${{ contains(matrix.platform, 'windows') }}
    - uses: leafo/gh-actions-lua@v11
      with:
        luaVersion: "5.4"
    - uses: luarocks/gh-actions-luarocks@master

    - name: build
      run: luarocks make etc/memory-scm-1.rockspec

    - name: test-lib-linux
      if: ${{ contains(matrix.platform, 'ubuntu') }}
      run: |
        cd test && \
        gcc -o memory_test.so ltestlib.c \
            --shared \
            -fPIC -DLUA_USE_MACOSX -I../src -I../.lua/include

    - name: test-lib-macos
      if: ${{ contains(matrix.platform, 'macos') }}
      run: |
        cd test && \
        export MACOSX_DEPLOYMENT_TARGET="10.10"; \
        gcc -o memory_test.so ltestlib.c \
            -bundle -undefined dynamic_lookup \
            -fno-common -DLUA_USE_MACOSX -I../src -I../.lua/include

    - name: test-lib-win
      if: ${{ contains(matrix.platform, 'windows') }}
      shell: cmd
      run: |
        luarocks show --rock-dir memory > memory.path
        set /p MEMORY_ROCKDIR=<memory.path
        cd test && ^
        cl.exe /nologo /I%MEMORY_ROCKDIR%\include /I..\.lua\include /c ltestlib.c && ^
        link.exe /nologo /dll ^
                 /out:memory_test.dll ^
                 /LIBPATH:..\.lua\lib ^
                 /LIBPATH:%MEMORY_ROCKDIR%\library ^
                 ltestlib.obj lua54.lib luamem.lib

    - name: test
      run: cd test && lua testall.lua
